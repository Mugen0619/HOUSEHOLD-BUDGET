server:
  port: 8080

spring:
  application:
    name: household-budget
  datasource:
    url: jdbc:postgresql://localhost:5432/household_budget
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
